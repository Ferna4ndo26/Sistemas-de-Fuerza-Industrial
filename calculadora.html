<script src="js/main.js"></script>
<script>
function calcFmt(n){
  return '$' + Math.round(n).toLocaleString('es-MX');
}

let calcUltimoResultado = "";

function buildWhatsAppLink(text){
  return "https://wa.me/?text=" + encodeURIComponent(text);
}

function calcCalcular(){
  const ingresoHora = parseFloat(document.getElementById('ingresoHora').value) || 0;
  const nominaHora = parseFloat(document.getElementById('nominaHora').value) || 0;
  const horasCorte = parseFloat(document.getElementById('horasCorte').value) || 0;
  const eventosAno = parseFloat(document.getElementById('eventosAno').value) || 0;
  const rentaMensual = parseFloat(document.getElementById('rentaMensual').value) || 0;

  const costoPorHora = ingresoHora + nominaHora;
  const costoPorEvento = costoPorHora * horasCorte;
  const costoAnualInactividad = costoPorEvento * eventosAno;
  const costoRentaAnual = rentaMensual * 12;

  document.getElementById('calcCostoAnual').textContent = calcFmt(costoAnualInactividad);
  document.getElementById('calcCostoEvento').textContent = calcFmt(costoPorEvento);
  document.getElementById('calcCostoAnualSub').textContent =
    eventosAno > 0
      ? `Basado en ${eventosAno} corte(s) al año de ${horasCorte} h cada uno`
      : 'Agrega el número de cortes estimados para ver el total anual';

  const veredictoEl = document.getElementById('calcVeredicto');
  const rentaAnualEl = document.getElementById('calcCostoRentaAnual');
  let veredictoTexto = "";

  if (rentaMensual > 0) {
    rentaAnualEl.textContent = calcFmt(costoRentaAnual);
    const ahorro = costoAnualInactividad - costoRentaAnual;
    if (ahorro > 0) {
      veredictoEl.classList.add('calc-good');
      veredictoTexto = `Con un generador de respaldo en renta, tu planta se ahorraría <b>${calcFmt(ahorro)} al año</b> comparado con el costo de quedarte sin energía.`;
    } else {
      veredictoEl.classList.remove('calc-good');
      veredictoTexto = `Con la frecuencia de cortes indicada, el costo de renta anual (<b>${calcFmt(costoRentaAnual)}</b>) es mayor o igual al costo estimado de inactividad. Contáctanos para ajustar la capacidad de respaldo a tu operación.`;
    }
  } else {
    rentaAnualEl.textContent = '—';
    veredictoEl.classList.remove('calc-good');
    veredictoTexto = `Cada corte le cuesta a tu operación aproximadamente <b>${calcFmt(costoPorEvento)}</b>. Agrega una renta mensual arriba para ver cuánto ahorrarías, o solicita una cotización para comparar opciones.`;
  }

  veredictoEl.innerHTML = veredictoTexto;

  calcUltimoResultado =
    "Resultado de calculadora de costo de inactividad — SFI Industrial\n" +
    `Costo por evento: ${calcFmt(costoPorEvento)}\n` +
    `Costo anual estimado de inactividad: ${calcFmt(costoAnualInactividad)}\n` +
    (rentaMensual > 0 ? `Costo anual de renta de respaldo: ${calcFmt(costoRentaAnual)}\n` : "") +
    "Quisiera una cotización de generador de respaldo para mi planta.";

  document.getElementById('calc-resultados').classList.add('show');
  document.getElementById('calc-resultados').scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('btn-calcular').addEventListener('click', calcCalcular);

document.getElementById('btn-wa-resultado').addEventListener('click', () => {
  if (!calcUltimoResultado) return;
  window.open(buildWhatsAppLink(calcUltimoResultado), "_blank");
});
</script>
